<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watchcraft Collections</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #0a100d; color: #edf5ef; }
      main { max-width: 52rem; margin: 0 auto; padding: 4rem 1.5rem; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 .5rem; }
      .tagline, p { color: #9eada4; line-height: 1.6; }
      .collection { margin-top: 1.5rem; padding: 1.25rem; border: 1px solid #355343; border-radius: 1rem; background: #111a15; }
      h2 { margin: 0 0 .4rem; }
      a { color: #a7efbd; }
      .actions { display: flex; flex-wrap: wrap; gap: .9rem; }
      .mode { color: #77a988; font-size: .85rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <p>WATCHCRAFT</p>
      <h1>Collections</h1>
      <p class="tagline">Portable examples for “Learn a craft by watching.” This site is a publisher, not a central registry. <a href="https://watchcraft.stream/">Download Watchcraft and browse collections on the main site.</a></p>
      <div id="collection-grid" aria-live="polite">
        <p>Loading available collections…</p>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
